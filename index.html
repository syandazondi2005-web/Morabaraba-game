<!DOCTYPE html>
<html>
<head>
  <title>Morabaraba</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Morabaraba</h1>
  <p id="instructions">Place your 12 pieces on the board. Form 3 pieces in a straight line (a "mill") to capture one of your opponent's pieces. Reduce your opponent to 2 pieces to win.</p>
  <p id="status">Player 1's turn — place a piece</p>
  <button id="restart-btn" onclick="restartGame()">New Game</button>
  <button id="hint-btn" onclick="showHint()">Hint</button>
  <div id="ai-toggle" style="margin-top:8px; font-size:13px;">
    <label><input type="checkbox" id="ai-checkbox" checked> Play vs Computer (Player 2)</label>
    <span style="margin-left:12px;">
      <label><input type="radio" name="difficulty" value="easy" checked> Easy</label>
      <label style="margin-left:8px;"><input type="radio" name="difficulty" value="hard"> Hard</label>
    </span>
  </div>

  <div id="game-layout">
    <div id="player1-profile" class="player-profile">
      <div class="profile-circle p1-circle"></div>
      <span>Player 1</span>
      <div id="p1-captured" class="captured-box"></div>
    </div>

    <svg id="board" width="400" height="400" viewBox="0 0 500 500">
      <defs>
        <radialGradient id="p1Gradient" cx="35%" cy="30%" r="75%">
          <stop offset="0%" stop-color="#6fb1f0"/>
          <stop offset="55%" stop-color="#1e5ba8"/>
          <stop offset="100%" stop-color="#0d3566"/>
        </radialGradient>
        <radialGradient id="p2Gradient" cx="35%" cy="30%" r="75%">
          <stop offset="0%" stop-color="#f0a080"/>
          <stop offset="55%" stop-color="#b5502e"/>
          <stop offset="100%" stop-color="#6e2e14"/>
        </radialGradient>
      </defs>
    </svg>

    <div id="player2-profile" class="player-profile">
      <div class="profile-circle p2-circle"></div>
      <span>Player 2</span>
      <div id="p2-captured" class="captured-box"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
